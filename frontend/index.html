<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 차트 분석 및 모의투자 시뮬레이션</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-layout">
    <!-- 왼쪽: AI 차트 분석 -->
    <section class="panel" id="ai-panel">
      <h2>AI 차트 분석</h2>
      <input type="file" id="imageInput" accept="image/*" onchange="previewImage()" />
      <img id="preview" style="display:none;max-width:100%;margin:10px 0;" />
      <button id="analyzeBtn" type="button">이미지 분석 시작</button>
      <div id="statusMessage"></div>
      <pre id="analysisResult" class="resultBox"></pre>
      <div id="questionSection" style="display:none;">
        <input type="text" id="userQuestion" placeholder="분석 관련 질문 입력..." />
        <button id="askBtn" type="button">질문하기</button>
        <pre id="answerResult" class="resultBox"></pre>
      </div>
    </section>
    <!-- 오른쪽: 포트폴리오 시뮬레이션 -->
    <section class="panel" id="sim-panel">
      <h2>모의 투자 시뮬레이션</h2>
      <button id="portfolioRefreshBtn" type="button">포트폴리오 새로고침</button>
      <div id="portfolioInfo" class="resultBox"></div>
      <div class="tradeSection">
        <h4>매수/매도</h4>
        <input id="tickerInput" placeholder="종목코드(예: AA)" maxlength="8" />
        <input id="quantityInput" type="number" min="1" placeholder="수량" />
        <button id="buyBtn" type="button">매수</button>
        <button id="sellBtn" type="button">매도</button>
      </div>
      <div id="tradeStatus"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
